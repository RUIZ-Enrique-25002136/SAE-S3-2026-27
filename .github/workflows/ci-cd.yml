name: CI/CD

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: php -l
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: phpstan:2
      - name: Analyse statique
        run: phpstan analyse --no-progress --error-format=github

  database:
    name: Schéma SQL (MariaDB 11.4)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sae_s3
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Import du schéma, des migrations et des données de test
        run: |
          run_sql() { mysql -h 127.0.0.1 -u root -proot sae_s3 < "$1"; }
          run_sql sql/schema.sql
          run_sql sql/schema.sql
          for f in sql/migrations/*.sql; do
            [ -e "$f" ] || continue
            run_sql "$f"
            run_sql "$f"
          done
          [ ! -e sql/seed.sql ] || run_sql sql/seed.sql

  deploy:
    name: Déploiement Alwaysdata
    needs: [ lint, phpstan, database ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Mise à jour via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/SAE-S3-2026-27
            git fetch origin main
            git reset --hard origin/main
